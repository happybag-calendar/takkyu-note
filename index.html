<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>卓球ノート</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f5c3a">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="卓球ノート">
<style>
/* 卓球台の深い緑と、ボールのオレンジ。大きな文字で、押しやすく */
:root{--bg:#f3f5f0;--card:#fff;--fg:#1d2b22;--sub:#5b6a60;--line:#cfd8cf;--green:#0f5c3a;--green-fg:#fff;--ball:#e8590c;--win:#0f7a46;--lose:#b3261e;--winbg:#e2f3e8;--losebg:#fbe7e5;--input:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1b261f;--fg:#eaf1ec;--sub:#9fb0a5;--line:#34463a;--green:#2f9e6a;--green-fg:#06170e;--ball:#ff8a4c;--win:#5fd39a;--lose:#ff8a80;--winbg:#1d3a2a;--losebg:#3d2220;--input:#101812;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1b261f;--fg:#eaf1ec;--sub:#9fb0a5;--line:#34463a;--green:#2f9e6a;--green-fg:#06170e;--ball:#ff8a4c;--win:#5fd39a;--lose:#ff8a80;--winbg:#1d3a2a;--losebg:#3d2220;--input:#101812;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:18px/1.6 "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:28px;line-height:1.3;display:flex;align-items:center;gap:10px}
h1 i{width:26px;height:26px;border-radius:50%;background:var(--ball);display:inline-block;flex:none}
h2{margin:0 0 10px;font-size:21px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-weight:bold;margin-bottom:4px;word-break:keep-all;overflow-wrap:anywhere}
input{font:inherit;color:var(--fg);background:var(--input);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus{outline:3px solid var(--ball);outline-offset:1px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.date{margin-bottom:12px}
.fmt{display:flex;gap:10px;margin:0 0 14px}.fmt label{flex:1;margin:0;cursor:pointer}.fmt input{position:absolute;opacity:0;width:1px;height:1px}.fmt span{word-break:keep-all;overflow-wrap:normal;line-height:1.35;display:block;text-align:center;border:2px solid var(--line);border-radius:12px;padding:10px 6px;font-weight:bold;background:var(--input)}.fmt input:checked+span{background:var(--green);color:var(--green-fg);border-color:var(--green)}.fmt input:focus-visible+span{outline:3px solid var(--ball);outline-offset:2px}.tag{font-size:14px;border:1px solid var(--line);border-radius:20px;padding:0 10px}
.games{display:grid;grid-template-columns:3.2em 1fr 1fr;gap:8px 10px;align-items:center;margin:14px 0 4px}
.games .h{font-weight:bold;color:var(--sub);font-size:15px;text-align:center;overflow-wrap:anywhere}
.games .g{font-weight:bold;color:var(--sub)}
.games input{text-align:center;font-size:24px;font-weight:bold;padding:8px 4px}
.result{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:22px;font-weight:bold;text-align:center;background:var(--bg);border:2px dashed var(--line);color:var(--sub)}
.result.win{background:var(--winbg);color:var(--win);border:2px solid var(--win)}
.hint{word-break:keep-all;overflow-wrap:anywhere;font-size:15px;color:var(--sub);margin:6px 0 0}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-weight:bold;border-radius:12px;border:2px solid var(--green);padding:12px 20px;cursor:pointer;background:var(--green);color:var(--green-fg);min-height:48px}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
button.small{padding:6px 12px;min-height:38px;font-size:16px}
button.danger{color:var(--lose);border-color:var(--lose);background:transparent}
button:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.msg{min-height:1.5em;font-weight:bold;color:var(--win);margin-top:8px}
.msg.err{color:var(--lose)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.tools>div{flex:1 1 180px}
.m{border:2px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.m .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--sub);font-size:16px}
.m .vs{font-size:22px;font-weight:bold;margin:4px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.m .vs .w{color:var(--win)}
.badge{font-size:15px;padding:2px 10px;border-radius:20px;background:var(--winbg);color:var(--win);border:1px solid var(--win)}
.m .sc{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.m .sc span{border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-weight:bold;font-variant-numeric:tabular-nums}
.m .big{font-size:20px;font-weight:bold;font-variant-numeric:tabular-nums}
.m .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left;font-weight:bold}
th{color:var(--sub);font-size:15px}
.scroll{overflow-x:auto}
.empty{color:var(--sub);padding:10px 0}
.note{font-size:14px;color:var(--sub)}
</style>
</head><body>
<div class="wrap">
<h1><i></i>卓球 対戦成績ノート</h1>

<section class="card" aria-labelledby="t1">
<h2 id="t1">試合を記録する</h2>
<div class="date"><label for="date">対戦日</label><input type="date" id="date"></div>
<div class="fmt" role="radiogroup" aria-label="試合の形式"><label><input type="radio" name="fmt" value="3"><span>3ゲーム<wbr>マッチ</span></label><label><input type="radio" name="fmt" value="5"><span>5ゲーム<wbr>マッチ</span></label></div>
<div class="row">
<div><label for="pa">選手A(あなた)の名前</label><input id="pa" list="names" placeholder="例:山田" autocomplete="off"><div class="hint" style="margin-top:2px" id="meHint">一度保存すると、あなたの名前として固定されます</div></div>
<div><label for="pb">選手B の名前</label><input id="pb" list="names" placeholder="例:佐藤" autocomplete="off"></div>
</div>
<datalist id="names"></datalist>
<div class="games" id="games"></div>
<p class="hint" id="hintTxt"></p>
<div class="result" id="result">点数を入れると、勝ち負けがここに出ます</div>
<div class="btns"><button id="save">保存する</button><button class="ghost" id="clear">入力をリセット</button></div>
<div class="msg" id="msg" role="status"></div>
</section>

<section class="card">
<h2>選手ごとの成績</h2>
<div class="scroll" id="stats"></div>
</section>

<section class="card">
<h2>これまでの試合</h2>
<div class="tools">
<div><label for="filter">選手名でしぼる</label><input id="filter" list="names" placeholder="名前を入れる(空なら全部)" autocomplete="off"></div>
</div>
<div id="list"></div>
<p class="note" id="where"></p>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
let matches=[], editingId=null, store=null;

/* ---- 保存先:ログインしていれば claude の db、だめならこの端末の localStorage ---- */
const LS="takkyu-matches-v1";
function lsRead(){try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return[]}}
function lsWrite(){try{localStorage.setItem(LS,JSON.stringify(matches))}catch(e){}}
const localStore={
  kind:"local",
  async save(m){const i=matches.findIndex(x=>x.id===m.id);if(i>=0)matches[i]=m;else matches.push(m);lsWrite();render()},
  async remove(id){matches=matches.filter(x=>x.id!==id);lsWrite();render()}
};
function initStore(){useLocal()}
function useLocal(){
  store=localStore;matches=lsRead();render();
  $("where").textContent="記録はこのスマホ(この端末)の中だけに保存されます。ほかの人には見えません。";
}

/* ---- 入力欄 ---- */
const G=5;
function getMe(){try{return localStorage.getItem("takkyu-me")||""}catch(e){return""}}
function setMe(v){try{localStorage.setItem("takkyu-me",v)}catch(e){}}
$("pa").value=getMe();
function lockMe(on){
  const pa=$("pa"),h=$("meHint");
  pa.readOnly=on;pa.style.background=on?"var(--bg)":"";
  h.innerHTML=on?'あなたの名前で固定中 <button type="button" class="small ghost" id="unlock" style="margin-left:6px">名前を変える</button>':"一度保存すると、あなたの名前として固定されます";
  if(on)$("unlock").onclick=()=>{lockMe(false);pa.focus();pa.select()};
}
lockMe(!!getMe());
(function build(){
  const g=$("games");
  g.innerHTML='<div></div><div class="h" id="ha">選手A</div><div class="h" id="hb">選手B</div>';
  for(let i=1;i<=G;i++){
    g.insertAdjacentHTML("beforeend",`<div class="g" data-r="${i}">${i}G</div>
    <input type="number" inputmode="numeric" min="0" max="99" data-r="${i}" id="a${i}" aria-label="${i}ゲーム目 選手Aの点数">
    <input type="number" inputmode="numeric" min="0" max="99" data-r="${i}" id="b${i}" aria-label="${i}ゲーム目 選手Bの点数">`);
  }
  const d=new Date();$("date").value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
})();

let FMT=5;
try{const v=+localStorage.getItem("takkyu-fmt");if(v===3||v===5)FMT=v}catch(e){}
function need(){return(FMT+1)/2}
function setFmt(n,keep){
  FMT=n;try{localStorage.setItem("takkyu-fmt",String(n))}catch(e){}
  document.querySelectorAll('input[name="fmt"]').forEach(r=>r.checked=(+r.value===n));
  document.querySelectorAll("#games [data-r]").forEach(el=>{const hid=+el.dataset.r>n;el.hidden=hid;if(hid&&el.tagName==="INPUT")el.value=""});
  $("hintTxt").textContent=n+"ゲームマッチ:先に"+need()+"ゲーム取った人の勝ちです。";
  updateResult();
}
document.addEventListener("change",e=>{if(e.target.name==="fmt")setFmt(+e.target.value)});
function readGames(){
  const gs=[];
  for(let i=1;i<=FMT;i++){
    const a=$("a"+i).value,b=$("b"+i).value;
    if(a!==""&&b!=="")gs.push([+a,+b]);
  }
  return gs;
}
function tally(gs){let a=0,b=0;gs.forEach(([x,y])=>{if(x>y)a++;else if(y>x)b++});return[a,b]}
function nm(v,d){return v.trim()||d}

function updateResult(){
  const pa=nm($("pa").value,"選手A"),pb=nm($("pb").value,"選手B");
  $("ha").textContent=pa;$("hb").textContent=pb;
  const gs=readGames(),[a,b]=tally(gs),r=$("result");
  if(!gs.length){r.className="result";r.textContent="点数を入れると、勝ち負けがここに出ます";return}
  if(Math.max(a,b)<need()){r.className="result";r.textContent=`${a} − ${b}(先に${need()}ゲームで勝ち)`;return}
  r.className="result win";
  r.textContent=`${a>b?pa:pb} の勝ち(${Math.max(a,b)} − ${Math.min(a,b)})`;
}
document.addEventListener("input",e=>{if(e.target.closest(".games")||e.target.id==="pa"||e.target.id==="pb")updateResult();if(e.target.id==="filter")renderList()});

function say(t,err){const m=$("msg");m.textContent=t;m.className="msg"+(err?" err":"")}
function resetForm(keepNames){
  for(let i=1;i<=G;i++){$("a"+i).value="";$("b"+i).value=""}
  if(!keepNames){$("pa").value=getMe();$("pb").value=""}
  editingId=null;lockMe(!!getMe());$("save").textContent="保存する";updateResult();
}
$("clear").onclick=()=>{resetForm(false);say("")};

$("save").onclick=async()=>{
  const pa=$("pa").value.trim(),pb=$("pb").value.trim(),date=$("date").value,gs=readGames();
  if(!date)return say("対戦日を入れてください",true);
  if(!pa||!pb)return say("選手A・選手Bの名前を入れてください",true);
  if(pa===pb)return say("2人の名前が同じです。別の名前にしてください",true);
  if(!gs.length)return say("点数を1ゲーム以上入れてください",true);
  const [a,b]=tally(gs);
  if(Math.max(a,b)<need())return say(FMT+"ゲームマッチは、先に"+need()+"ゲーム取った人の勝ちです。点数を見直してください",true);
  const id=editingId||("m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const wasEdit=!!editingId;if(!wasEdit){setMe(pa);lockMe(true)}
  try{
    await store.save({id,date,pa,pb,games:gs.map(g=>g.join("-")),wa:a,wb:b,fmt:FMT});
    say(wasEdit?"直しました":"保存しました");
    resetForm(true);
  }catch(e){say("保存できませんでした。もう一度ためしてください",true)}
};

/* ---- 表示 ---- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmtDate(s){const p=(s||"").split("-");return p.length===3?`${+p[0]}年${+p[1]}月${+p[2]}日`:s}
function names(){return[...new Set(matches.flatMap(m=>[m.pa,m.pb]))].sort((x,y)=>x.localeCompare(y,"ja"))}

function renderStats(){
  const s={};
  matches.forEach(m=>{
    [[m.pa,m.wa>m.wb,m.wa,m.wb],[m.pb,m.wb>m.wa,m.wb,m.wa]].forEach(([n,w,gw,gl])=>{
      const o=s[n]||(s[n]={n,w:0,l:0,gw:0,gl:0});
      if(w)o.w++;else o.l++;o.gw+=gw;o.gl+=gl;
    });
  });
  const rows=Object.values(s).sort((a,b)=>(b.w/(b.w+b.l))-(a.w/(a.w+a.l))||b.w-a.w);
  $("stats").innerHTML=rows.length?`<table><tr><th>選手</th><th>勝</th><th>負</th><th>勝率</th><th>取ったG</th></tr>`+
    rows.map(o=>`<tr><td>${esc(o.n)}</td><td style="color:var(--win);font-weight:bold">${o.w}</td><td style="color:var(--lose);font-weight:bold">${o.l}</td><td>${Math.round(o.w/(o.w+o.l)*100)}%</td><td>${o.gw}-${o.gl}</td></tr>`).join("")+`</table>`
    :'<div class="empty">試合を保存すると、ここに勝ち負けの数が出ます。</div>';
}
function renderList(){
  const f=$("filter").value.trim();
  const list=matches.filter(m=>!f||m.pa.includes(f)||m.pb.includes(f))
    .sort((a,b)=>(b.date||"").localeCompare(a.date||"")||b.id.localeCompare(a.id));
  $("list").innerHTML=list.length?list.map(m=>{
    const aw=m.wa>m.wb;
    return `<div class="m"><div class="top"><span>${fmtDate(m.date)}</span>${m.fmt?`<span class="tag">${m.fmt}ゲームマッチ</span>`:""}</div>
    <div class="vs"><span class="${aw?"w":""}">${esc(m.pa)}</span>${aw?'<span class="badge">勝ち</span>':""}
    <span class="big">${m.wa} − ${m.wb}</span>
    <span class="${aw?"":"w"}">${esc(m.pb)}</span>${aw?"":'<span class="badge">勝ち</span>'}</div>
    <div class="sc">${(m.games||[]).map((g,i)=>`<span>${i+1}G ${esc(g.replace("-"," - "))}</span>`).join("")}</div>
    <div class="acts"><button class="small ghost" data-edit="${esc(m.id)}">直す</button><button class="small danger" data-del="${esc(m.id)}">消す</button></div></div>`;
  }).join(""):`<div class="empty">${matches.length?"その名前の試合はありません。":"まだ記録がありません。上の欄から最初の1試合を入れてみましょう。"}</div>`;
}
function render(){
  $("names").innerHTML=names().map(n=>`<option value="${esc(n)}">`).join("");
  renderStats();renderList();
}
let delArm=null;
$("list").addEventListener("click",async e=>{
  const ed=e.target.closest("[data-edit]"),de=e.target.closest("[data-del]");
  if(ed){
    const m=matches.find(x=>x.id===ed.dataset.edit);if(!m)return;
    editingId=m.id;lockMe(false);setFmt(m.fmt||5);$("date").value=m.date;$("pa").value=m.pa;$("pb").value=m.pb;
    for(let i=1;i<=G;i++){const g=(m.games||[])[i-1];$("a"+i).value=g?g.split("-")[0]:"";$("b"+i).value=g?g.split("-")[1]:""}
    $("save").textContent="直した内容を保存する";updateResult();say("直したら「直した内容を保存する」を押してください");
    window.scrollTo({top:0,behavior:"smooth"});
  }
  if(de){
    if(delArm!==de.dataset.del){delArm=de.dataset.del;de.textContent="本当に消す?もう一度押す";setTimeout(()=>{delArm=null;if(de.isConnected)de.textContent="消す"},4000);return}
    delArm=null;try{await store.remove(de.dataset.del)}catch(err){say("消せませんでした",true)}
  }
});

setFmt(FMT);
initStore();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script></body></html>
